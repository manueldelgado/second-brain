vault:
  root: "~/Documents/MyVault"           # Path to your Obsidian vault
  # name: "MyVault"                     # Vault name in Obsidian (for vault_backend: obsidian_cli);
                                        # defaults to the root folder's name
  inbox_folder: "00 Inbox"
  notes_folder: "01 Notes"
  assets_folder: "04 Assets"
  sync_state_file: "sync_state.yaml"   # Relative to project root
  batch_state_file: "batch_state.yaml" # Relative to project root

vault_backend: "filesystem"            # "filesystem" (default) or "obsidian_cli"

llm:
  # "claude": Anthropic API (ANTHROPIC_API_KEY, pay per token; supports --batch).
  # "claude_cli": local `claude -p`, billed to the Claude subscription it is logged in
  #   with (the API key is never passed to it). Synchronous only; `effort` applies,
  #   `max_tokens`, `thinking` and `batch` are ignored.
  provider: "claude"
  model: "claude-haiku-4-5-20251001"   # See console.anthropic.com for available models
  max_tokens: 2048
  # Optional; omit for Haiku 4.5 (it rejects `effort`). For Sonnet 5 use thinking: "disabled"
  # (or "adaptive" with a larger max_tokens) and effort: low | medium | high | xhigh | max.
  # thinking: "disabled"
  # effort: "low"
  batch:
    poll_interval_seconds: 30          # How often to check batch status when waiting inline
    timeout_hours: 24                  # Give up polling after this many hours

gmail:
  credentials_file: "~/.config/second-brain/gmail_credentials.json"
  token_file: "~/.config/second-brain/gmail_token.json"
  scopes:
    - "https://www.googleapis.com/auth/gmail.modify"  # Required for labelling

processing:
  default_lookback_days: 7    # How far back to fetch for new/unknown newsletter sources
  dry_run: false
  # Inbox: re-fetch each clipping's source URL to recover the full article and missing
  # author/date. The captured text is only replaced if the fetched one is longer.
  enrich_from_web: true
  web_fetch_timeout_seconds: 20  # Per-URL download timeout
